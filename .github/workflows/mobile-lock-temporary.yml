name: Temporary mobile lockfile generation
on:
  push:
    branches:
      - mobile/43-local-runtime
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate pinned dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo 'GODSMASH_LOCK_BEGIN'
          base64 -w 120 package-lock.json
          echo 'GODSMASH_LOCK_END'
