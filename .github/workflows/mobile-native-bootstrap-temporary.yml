name: Temporary native Capacitor scaffolding
on:
  push:
    branches:
      - mobile/44-capacitor-platforms
permissions:
  contents: write
jobs:
  android-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/44-capacitor-platforms
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned dependencies and create Android shell
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npx cap add android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android/
          git commit -m "chore(mobile): generate Android Capacitor template" || true
          git push origin HEAD:mobile/44-capacitor-platforms
  ios-template:
    needs: android-template
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/44-capacitor-platforms
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create iOS shell
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npx cap add ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/
          git commit -m "chore(mobile): generate iOS Capacitor template" || true
          git push origin HEAD:mobile/44-capacitor-platforms
