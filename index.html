<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GodSmash v1.0 — شبیه‌ساز تخریب سیاره زمین</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./src/content/catalog.js"></script>
<script src="./src/render/planet-textures.js"></script>
<script src="./src/render/real-earth.js"></script>
<script src="./src/render/projectile-models.js"></script>
<script src="./src/render/planet-damage.js"></script>
<script src="./src/render/impact-effects.js"></script>
  <script src="./src/ui/weapon-dock.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Vazirmatn', 'Inter', sans-serif;
      color: #f8fafc;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
    }
    .hud-btn {
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hud-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(249, 115, 22, 0.6);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
    .pulse-ring {
      animation: pulseGlow 2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
      50% { box-shadow: 0 0 18px 4px rgba(239, 68, 68, 0.25); }
    }
    /* Fixed weapon inventory above the bottom HUD; footer height is observed in JS. */
    .weapon-dock {
      position: fixed;
      z-index: 21;
      left: max(12px, env(safe-area-inset-left));
      bottom: var(--footer-clearance, 110px);
      width: 212px;
      max-height: calc(100dvh - var(--footer-clearance, 110px) - 100px);
      padding: 10px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      pointer-events: auto;
    }
    .weapon-dock-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 0 3px;
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 800;
    }
    .weapon-dock-heading small {
      color: #94a3b8;
      font-size: 10px;
      font-weight: 500;
    }
    .weapon-dock-items {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 6px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
      padding: 2px;
    }
    .weapon-dock-button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      direction: rtl;
      text-align: right;
      width: 100%;
      min-height: 50px;
      padding: 7px 8px;
      border: 1px solid rgba(148,163,184,.22);
      border-radius: 12px;
      background: rgba(15,23,42,.72);
      color: #e2e8f0;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .weapon-dock-button:hover { background: rgba(51,65,85,.92); }
    .weapon-dock-button:active { transform: scale(.97); }
    .weapon-dock-button:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 2px; }
    .weapon-dock-button.is-active {
      border-color: #fb923c;
      background: linear-gradient(110deg, rgba(124,45,18,.9), rgba(67,30,27,.85));
      box-shadow: inset 0 0 0 1px rgba(251,146,60,.38), 0 0 12px rgba(249,115,22,.16);
      color: #fff7ed;
    }
    .weapon-dock-icon {
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(148,163,184,.13);
      font-size: 19px;
      line-height: 1;
    }
    .weapon-dock-button.is-active .weapon-dock-icon { background: rgba(251,146,60,.18); }
    .weapon-dock-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 3px; }
    .weapon-dock-name { font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .weapon-dock-detail { font-size: 9px; color: #94a3b8; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .weapon-dock-key { color: #94a3b8; font-size: 10px; align-self: flex-start; font-family: monospace; }
    .weapon-dock-short { display: none; }
    @media (max-width: 640px) {
      .weapon-dock {
        width: 154px;
        padding: 8px;
        gap: 7px;
        border-radius: 15px;
        max-height: calc(100dvh - var(--footer-clearance, 155px) - 86px);
      }
      .weapon-dock-heading { font-size: 11px; }
      .weapon-dock-heading small { display: none; }
      .weapon-dock-items { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .weapon-dock-button {
        min-width: 0;
        min-height: 60px;
        padding: 6px 3px;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        text-align: center;
      }
      .weapon-dock-icon { flex-basis: 27px; width: 27px; height: 27px; font-size: 16px; }
      .weapon-dock-copy, .weapon-dock-key { display: none; }
      .weapon-dock-short {
        display: block;
        width: 100%;
        font-size: 9px;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .weapon-dock-button { transition: none; }
    }
    .num-mono {
      font-family: 'Inter', 'Vazirmatn', monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden select-none">

  <!-- 3D WebGL Viewport -->
  <div id="canvas-container" aria-label="فضای سه‌بعدی سیاره زمین"></div>

  <!-- Subtle Reticle Crosshair in Center of Screen -->
  <div id="center-reticle" class="pointer-events-none fixed inset-0 flex items-center justify-center z-10 opacity-40">
    <div class="w-8 h-8 rounded-full border border-orange-400/60 flex items-center justify-center">
      <div class="w-1.5 h-1.5 rounded-full bg-orange-400"></div>
    </div>
  </div>

  <!-- Top HUD Bar: Earth Vital Stats & Quick Toggles (No Menus, Direct Gameplay) -->
  <header class="fixed top-3 inset-x-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <!-- Planet Status Card -->
    <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-4 pointer-events-auto">
      <div class="flex items-center gap-2.5">
        <div class="relative w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]" id="planet-status-dot"></div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold tracking-wide text-sky-400"><span id="planet-name">سیاره زمین (EARTH)</span></span>
            <span id="status-badge" class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium">پایدار</span>
          </div>
          <div class="flex items-center gap-3 mt-1">
            <div class="text-xs text-slate-300">
              جمعیت: <span id="population-val" class="num-mono font-bold text-white">8,000,000,000</span>
            </div>
            <span class="text-slate-600">|</span>
            <div class="text-xs text-slate-300">
              برخوردها: <span id="impacts-val" class="num-mono font-bold text-orange-400">0</span> <span class="text-slate-600">|</span> حفره‌ها: <span id="breaches-val" class="num-mono font-bold text-rose-400">0</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Core Integrity Progress Bar -->
      <div class="hidden sm:flex flex-col min-w-[130px] border-r border-slate-700/70 pr-3">
        <div class="flex items-center justify-between text-[11px] mb-1">
          <span class="text-slate-400">انسجام پوسته و هسته</span>
          <span id="integrity-val" class="num-mono font-bold text-emerald-400">100%</span>
        </div>
        <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
          <div id="integrity-bar" class="h-full bg-gradient-to-l from-emerald-400 via-amber-400 to-rose-500 transition-all duration-300" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Last Strike Toast / Telemetry & Utility Controls -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <div id="impact-toast" class="glass-panel rounded-xl px-3 py-2 text-xs text-amber-300 hidden items-center gap-2 border-amber-500/40">
        <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        <span id="impact-toast-text">اصابت ثبت شد</span>
      </div>

      <button id="btn-autorotate" type="button" class="hud-btn glass-panel rounded-xl px-3 py-2 text-xs font-medium text-slate-200 flex items-center gap-1.5" title="چرخش خودکار زمین">
        <span id="autorotate-icon">🔄</span>
        <span class="hidden md:inline" id="autorotate-label">چرخش: روشن</span>
      </button>

      <button id="btn-audio" type="button" class="hud-btn glass-panel rounded-xl px-3 py-2 text-xs font-medium text-slate-200 flex items-center gap-1.5" title="صدا و افکت صوتی">
        <span id="audio-icon">🔊</span>
        <span class="hidden md:inline" id="audio-label">صدا: فعال</span>
      </button>

      <button id="btn-reset" type="button" class="hud-btn glass-panel rounded-xl px-3 py-2 text-xs font-semibold text-sky-300 hover:text-white border-sky-500/30 flex items-center gap-1.5" title="بازسازی کامل سیاره زمین">
        <span>↺</span>
        <span>بازسازی سیاره</span>
      </button>
    </div>
  </header>

  <!-- Fixed left-corner weapon inventory. The planet selector stays in the HUD. -->
  <aside id="weapon-dock" class="weapon-dock glass-panel" aria-label="انتخاب سلاح">
    <div class="weapon-dock-heading"><span>سلاح‌ها</span><small>کلیدهای ۱ تا ۵</small></div>
    <div id="weapon-dock-items" class="weapon-dock-items" role="group" aria-label="فهرست سلاح‌ها"></div>
  </aside>

  <!-- Bottom HUD Bar: Planet and firing controls -->
  <footer id="game-controls" class="fixed bottom-3 inset-x-3 z-20 flex flex-col sm:flex-row items-center justify-between gap-2.5 pointer-events-none">
    <!-- Active Weapon Indicator (v1: Single Missile Type) -->
    <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center gap-3 pointer-events-auto w-full sm:w-auto justify-between sm:justify-start">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500/30 to-rose-600/30 border border-orange-500/50 flex items-center justify-center text-lg shadow-inner">
          <span id="active-weapon-icon">🚀</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-white"><span id="weapon-title">موشک هسته‌ای قاره‌پیما (ICBM-V1)</span></span>
            <span id="active-weapon-subtitle" class="text-[10px] px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-300 border border-orange-500/30 num-mono">50 MT</span>
          </div>
          <p class="text-[11px] text-slate-400 mt-0.5">
            سلاح و سیاره را انتخاب کنید؛ سپس روی سطح سیاره لمس کنید
          </p>
        </div>
      </div>
    </div>

    <!-- Dynamic selectors -->
    <div class="glass-panel rounded-2xl px-3 py-2 flex items-center gap-2 pointer-events-auto w-full sm:w-auto justify-center">
      <label for="planet-select" class="text-xs">سیاره</label><select id="planet-select" class="rounded-lg bg-slate-800 border border-slate-600 p-2 text-xs" aria-label="انتخاب سیاره"></select>
      <button id="btn-mode-toggle" type="button" class="hud-btn rounded-xl px-3 py-2 text-xs font-semibold bg-slate-800/90 text-slate-200 border border-slate-600/60 flex items-center gap-1.5">
        <span>🎯</span>
        <span id="mode-label">حالت: تک‌موشک</span>
      </button>

      <button id="btn-fire-center" type="button" class="hud-btn pulse-ring rounded-xl px-4 py-2 text-xs font-bold bg-gradient-to-r from-orange-500 to-rose-600 text-white border border-orange-400/50 flex items-center gap-2 shadow-lg">
        <span>🔥</span>
        <span>شلیک موشک (Space)</span>
      </button>

      <button id="btn-zoom-in" type="button" class="hud-btn rounded-xl w-8 h-8 text-sm font-bold bg-slate-800/90 text-slate-200 border border-slate-700 flex items-center justify-center" title="نزدیک‌تر">+</button>
      <button id="btn-zoom-out" type="button" class="hud-btn rounded-xl w-8 h-8 text-sm font-bold bg-slate-800/90 text-slate-200 border border-slate-700 flex items-center justify-center" title="دورتر">−</button>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      // ==========================================
      // 1. SYNTHESIZED WEB AUDIO ENGINE (No External Files)
      // ==========================================
      const SoundEngine = {
        ctx: null,
        muted: false,

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        },

        playLaunch() {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          // Target lock beep
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.09);
          oscGain.gain.setValueAtTime(0.08, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);

          // Rocket thruster whoosh (filtered white noise)
          const bufferSize = this.ctx.sampleRate * 0.45;
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = this.ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(400, now);
          filter.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
          filter.frequency.exponentialRampToValueAtTime(280, now + 0.45);
          filter.Q.value = 1.8;

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.01, now);
          noiseGain.gain.linearRampToValueAtTime(0.16, now + 0.08);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          whiteNoise.start(now);
          whiteNoise.stop(now + 0.45);
        },

        playExplosion(intensity = 1.0) {
          if (this.muted) return;
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 1.4 * intensity;

          // Sub-bass shockwave boom
          const subOsc = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          subOsc.type = 'triangle';
          subOsc.frequency.setValueAtTime(135, now);
          subOsc.frequency.exponentialRampToValueAtTime(24, now + duration);
          subGain.gain.setValueAtTime(0.38, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          subOsc.connect(subGain);
          subGain.connect(this.ctx.destination);
          subOsc.start(now);
          subOsc.stop(now + duration);

          // Broadband blast rumble
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.45));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const lowpass = this.ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.setValueAtTime(950, now);
          lowpass.frequency.exponentialRampToValueAtTime(90, now + duration);

          const noiseGain = this.ctx.createGain();
          noiseGain.gain.setValueAtTime(0.32, now);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(lowpass);
          lowpass.connect(noiseGain);
          noiseGain.connect(this.ctx.destination);
          noise.start(now);
          noise.stop(now + duration);
        }
      };

      // ==========================================
      // 2. GAME STATE & CONFIGURATION
      // ==========================================
      const catalog = window.GodSmashCatalog;
      let planet = catalog.getPlanet("earth");
      let weapon = catalog.getWeapon("icbm");
      let generation = 0;
      const EARTH_RADIUS = 10;
      const INITIAL_POPULATION = 8000000000;

      const state = {
        population: INITIAL_POPULATION,
        impacts: 0,
        integrity: 100,
        shattered: false,
        autoRotate: true,
        salvoMode: false, // false = 1 missile, true = 3 missiles of the same type
        cameraTheta: 0.4,
        cameraPhi: 1.25,
        cameraDistance: 28,
        targetCameraDistance: 28,
        screenShake: 0
      };

      // DOM Elements
      const container = document.getElementById('canvas-container');
      const popEl = document.getElementById('population-val');
      const impactsEl = document.getElementById('impacts-val');
      const breachesEl = document.getElementById('breaches-val');
      const integrityValEl = document.getElementById('integrity-val');
      const integrityBarEl = document.getElementById('integrity-bar');
      const statusBadgeEl = document.getElementById('status-badge');
      const statusDotEl = document.getElementById('planet-status-dot');
      const toastEl = document.getElementById('impact-toast');
      const toastTextEl = document.getElementById('impact-toast-text');
      const btnAutoRotate = document.getElementById('btn-autorotate');
      const autoRotateLabel = document.getElementById('autorotate-label');
      const btnAudio = document.getElementById('btn-audio');
      const audioIcon = document.getElementById('audio-icon');
      const audioLabel = document.getElementById('audio-label');
      const btnReset = document.getElementById('btn-reset');
      const btnModeToggle = document.getElementById('btn-mode-toggle');
      const modeLabel = document.getElementById('mode-label');
      const btnFireCenter = document.getElementById('btn-fire-center');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');

      let toastTimeout = null;
      function showImpactToast(msg) {
        toastTextEl.textContent = msg;
        toastEl.classList.remove('hidden');
        toastEl.classList.add('flex');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastEl.classList.add('hidden');
          toastEl.classList.remove('flex');
        }, 2800);
      }

      function updateHUD() {
        popEl.textContent = Math.max(0, Math.round(state.population)).toLocaleString('en-US');
        impactsEl.textContent = state.impacts.toString();
        breachesEl.textContent = planetDamage.getBreachCount().toString();
        const intPct = Math.max(0, Math.round(state.integrity));
        integrityValEl.textContent = intPct + '%';
        integrityBarEl.style.width = intPct + '%';

        if (state.shattered || intPct <= 0) {
          statusBadgeEl.textContent = 'متلاشی‌شده';
          statusBadgeEl.className = 'text-[11px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40 font-medium';
          statusDotEl.className = 'relative w-3.5 h-3.5 rounded-full bg-rose-500 shadow-[0_0_12px_#f43f5e]';
          integrityValEl.className = 'num-mono font-bold text-rose-400';
        } else if (intPct < 45) {
          statusBadgeEl.textContent = 'بحرانی';
          statusBadgeEl.className = 'text-[11px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 font-medium';
          statusDotEl.className = 'relative w-3.5 h-3.5 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]';
          integrityValEl.className = 'num-mono font-bold text-amber-400';
        } else {
          statusBadgeEl.textContent = 'پایدار';
          statusBadgeEl.className = 'text-[11px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium';
          statusDotEl.className = 'relative w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]';
          integrityValEl.className = 'num-mono font-bold text-emerald-400';
        }
      }

      // ==========================================
      // 3. THREE.JS SCENE, CAMERA & LIGHTING
      // ==========================================
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0x28385e, 0.9);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xfff7ed, 2.2);
      sunLight.position.set(45, 22, 35);
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
      rimLight.position.set(-35, -15, -25);
      scene.add(rimLight);

      // Starfield Background
      function createStarfield() {
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2600;
        const positions = new Float32Array(starCount * 3);
        const colors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
          const r = 140 + Math.random() * 240;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = r * Math.cos(phi);

          const tint = Math.random();
          if (tint > 0.85) {
            colors[i * 3] = 0.75; colors[i * 3 + 1] = 0.88; colors[i * 3 + 2] = 1.0;
          } else if (tint > 0.7) {
            colors[i * 3] = 1.0; colors[i * 3 + 1] = 0.92; colors[i * 3 + 2] = 0.75;
          } else {
            colors[i * 3] = 0.95; colors[i * 3 + 1] = 0.97; colors[i * 3 + 2] = 1.0;
          }
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const starMat = new THREE.PointsMaterial({
          size: 0.75,
          vertexColors: true,
          transparent: true,
          opacity: 0.9
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);
      }
      createStarfield();

      // ==========================================
      // 4. PROCEDURAL PLANET EARTH & DYNAMIC CRATER TEXTURES
      // ==========================================
      // Adaptive canvas resolution: photographic imagery with a smaller mobile footprint.
      const TEX_W = Math.min(window.innerWidth, window.innerHeight) < 750 ? 1024 : 2048;
      const TEX_H = TEX_W / 2;

      const surfaceCanvas = document.createElement('canvas');
      surfaceCanvas.width = TEX_W;
      surfaceCanvas.height = TEX_H;
      const surfaceCtx = surfaceCanvas.getContext('2d');

      const emissiveCanvas = document.createElement('canvas');
      emissiveCanvas.width = TEX_W;
      emissiveCanvas.height = TEX_H;
      const emissiveCtx = emissiveCanvas.getContext('2d');

      // Landmass polygons (normalized [u, v] approximations of Continents)
      const continents = [
        // North America
        [[0.12,0.18],[0.24,0.16],[0.31,0.24],[0.27,0.36],[0.22,0.44],[0.17,0.38],[0.10,0.26]],
        // South America
        [[0.25,0.48],[0.33,0.52],[0.36,0.64],[0.31,0.81],[0.27,0.84],[0.24,0.66]],
        // Greenland
        [[0.33,0.10],[0.41,0.09],[0.39,0.18],[0.34,0.17]],
        // Europe
        [[0.46,0.18],[0.57,0.16],[0.59,0.28],[0.51,0.31],[0.45,0.27]],
        // Africa
        [[0.45,0.34],[0.56,0.34],[0.61,0.46],[0.58,0.68],[0.52,0.74],[0.47,0.56],[0.43,0.44]],
        // Asia
        [[0.57,0.16],[0.83,0.15],[0.88,0.28],[0.81,0.44],[0.71,0.47],[0.62,0.38],[0.58,0.27]],
        // India & SE Asia
        [[0.68,0.38],[0.77,0.40],[0.79,0.52],[0.71,0.50]],
        // Australia
        [[0.77,0.60],[0.88,0.60],[0.90,0.72],[0.81,0.75],[0.76,0.69]],
        // Japan & Islands
        [[0.85,0.27],[0.88,0.29],[0.86,0.34],[0.84,0.31]]
      ];

      function drawPoly(ctx, poly, fillStyle, blur = 0) {
        ctx.save();
        if (blur > 0) ctx.filter = `blur(${blur}px)`;
        ctx.beginPath();
        poly.forEach((pt, idx) => {
          const x = pt[0] * TEX_W;
          const y = pt[1] * TEX_H;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
        ctx.restore();
      }

      function paintPristineEarthTextures() {
        // 1. Deep Ocean Gradient
        const oceanGrad = surfaceCtx.createLinearGradient(0, 0, 0, TEX_H);
        oceanGrad.addColorStop(0, '#0c2d48');
        oceanGrad.addColorStop(0.2, '#07223b');
        oceanGrad.addColorStop(0.5, '#0a365c');
        oceanGrad.addColorStop(0.8, '#07223b');
        oceanGrad.addColorStop(1, '#0c2d48');
        surfaceCtx.fillStyle = oceanGrad;
        surfaceCtx.fillRect(0, 0, TEX_W, TEX_H);

        // Subtle ocean bathymetry ridges
        for (let i = 0; i < 180; i++) {
          surfaceCtx.fillStyle = i % 2 === 0 ? 'rgba(14, 116, 144, 0.08)' : 'rgba(2, 6, 23, 0.1)';
          surfaceCtx.beginPath();
          surfaceCtx.arc(
            Math.random() * TEX_W,
            Math.random() * TEX_H,
            10 + Math.random() * 55,
            0,
            Math.PI * 2
          );
          surfaceCtx.fill();
        }

        // 2. Continental Shelf Glow
        continents.forEach(poly => {
          drawPoly(surfaceCtx, poly, 'rgba(14, 165, 233, 0.28)', 10);
        });

        // 3. Landmasses Base Green/Forest
        continents.forEach(poly => {
          drawPoly(surfaceCtx, poly, '#1f6f43', 3);
        });

        // 4. Biome Detailing (Deserts, Mountains, Steppes)
        const desertZones = [
          { x: 0.51, y: 0.40, rx: 0.06, ry: 0.045, color: '#b48a4e' }, // Sahara
          { x: 0.60, y: 0.37, rx: 0.04, ry: 0.035, color: '#a87e43' }, // Arabian
          { x: 0.83, y: 0.66, rx: 0.045, ry: 0.04, color: '#b06d3b' }, // Outback
          { x: 0.19, y: 0.32, rx: 0.035, ry: 0.03, color: '#8c6d46' }, // Western US
          { x: 0.72, y: 0.30, rx: 0.055, ry: 0.04, color: '#8b7355' }  // Gobi/Himalayas
        ];
        desertZones.forEach(z => {
          surfaceCtx.save();
          surfaceCtx.filter = 'blur(8px)';
          surfaceCtx.fillStyle = z.color;
          surfaceCtx.beginPath();
          surfaceCtx.ellipse(z.x * TEX_W, z.y * TEX_H, z.rx * TEX_W, z.ry * TEX_H, 0.2, 0, Math.PI * 2);
          surfaceCtx.fill();
          surfaceCtx.restore();
        });

        // 5. Polar Ice Caps (Arctic & Antarctica)
        surfaceCtx.fillStyle = '#e2e8f0';
        surfaceCtx.fillRect(0, 0, TEX_W, 24);
        surfaceCtx.fillRect(0, TEX_H - 36, TEX_W, 36);

        // 6. Emissive Map (City Lights at Night + Zero Lava Initially)
        emissiveCtx.fillStyle = '#000000';
        emissiveCtx.fillRect(0, 0, TEX_W, TEX_H);

        // City light clusters on continents
        const cityHubs = [
          [0.23, 0.29], [0.26, 0.31], [0.16, 0.31], [0.32, 0.62],
          [0.49, 0.24], [0.53, 0.26], [0.55, 0.36], [0.71, 0.41],
          [0.79, 0.34], [0.83, 0.31], [0.86, 0.31], [0.86, 0.69]
        ];
        cityHubs.forEach(hub => {
          for (let j = 0; j < 28; j++) {
            const cx = (hub[0] + (Math.random() - 0.5) * 0.05) * TEX_W;
            const cy = (hub[1] + (Math.random() - 0.5) * 0.04) * TEX_H;
            emissiveCtx.fillStyle = 'rgba(251, 191, 36, 0.55)';
            emissiveCtx.fillRect(cx, cy, 1.8, 1.8);
          }
        });
      }

      function paintPlanet() {
        if (planet.id === "earth") {
          if (!window.GodSmashRealEarth.paint(surfaceCtx, emissiveCtx, TEX_W, TEX_H)) {
            paintPristineEarthTextures(); // Offline/loading fallback
          }
        } else {
          GodSmashTextures.paint(planet, surfaceCtx, emissiveCtx, TEX_W, TEX_H);
        }
      }
      paintPlanet();

      const surfaceTexture = new THREE.CanvasTexture(surfaceCanvas);
      surfaceTexture.encoding = THREE.sRGBEncoding;
      surfaceTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      const emissiveTexture = new THREE.CanvasTexture(emissiveCanvas);
      emissiveTexture.encoding = THREE.sRGBEncoding;

      // Cloud Layer Texture
      function createCloudTexture() {
        const cCanvas = document.createElement('canvas');
        cCanvas.width = 512;
        cCanvas.height = 256;
        const cCtx = cCanvas.getContext('2d');
        cCtx.clearRect(0, 0, 512, 256);
        for (let i = 0; i < 220; i++) {
          const x = Math.random() * 512;
          const y = 18 + Math.random() * 220;
          const rx = 12 + Math.random() * 38;
          const ry = 4 + Math.random() * 12;
          const grad = cCtx.createRadialGradient(x, y, 1, x, y, rx);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.38)');
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          cCtx.fillStyle = grad;
          cCtx.beginPath();
          cCtx.ellipse(x, y, rx, ry, (Math.random() - 0.5) * 0.5, 0, Math.PI * 2);
          cCtx.fill();
        }
        return new THREE.CanvasTexture(cCanvas);
      }

      // Earth Group
      const earthGroup = new THREE.Group();
      scene.add(earthGroup);

      // High-density sphere geometry so vertices can be displaced into 3D craters
      const SEGMENTS = 112;
      let earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, SEGMENTS, SEGMENTS);
      // Original vertices and triangle indices are cached by planet-damage.js.

      const earthMat = new THREE.MeshStandardMaterial({
        map: surfaceTexture,
        emissiveMap: emissiveTexture,
        emissive: new THREE.Color(0xffffff),
        emissiveIntensity: 1.35,
        roughness: 0.68,
        metalness: 0.12
      });

      const earthMesh = new THREE.Mesh(earthGeo, earthMat);
      earthGroup.add(earthMesh);

      // Clouds Mesh
      const cloudGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.018, 64, 64);
      const fallbackCloudTexture = createCloudTexture();
      const cloudMat = new THREE.MeshStandardMaterial({
        map: fallbackCloudTexture,
        transparent: true,
        opacity: 0.65,
        depthWrite: false,
        roughness: 1.0
      });
      const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
      earthGroup.add(cloudMesh);

      // Atmospheric Fresnel Rim Glow
      const atmosGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.09, 64, 64);
      const atmosMat = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vNormal;
          uniform vec3 rimColor;
          void main() {
            float intensity = pow(0.62 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.8);
            gl_FragColor = vec4(rimColor, 1.0) * intensity * 1.35;
          }
        `,
        uniforms: {rimColor: {value: new THREE.Color("#38a6ff")}},
        blending: THREE.AdditiveBlending,
        side: THREE.BackSide,
        transparent: true,
        depthWrite: false
      });
      const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
      scene.add(atmosMesh);
      const lowImpactQuality = Math.min(window.innerWidth, window.innerHeight) < 750 ||
        !!(navigator.connection && navigator.connection.saveData);
      const planetDamage = window.GodSmashPlanetDamage.createSystem(THREE, {
        geometry: earthGeo, group: earthGroup, radius: EARTH_RADIUS,
        lowQuality: lowImpactQuality
      });
      const impactEffects = window.GodSmashImpactEffects;

      // ==========================================
      // 5. CRATER DEFORMATION & MAGMA SCORCHING
      // ==========================================
      function carveCraterOnEarth(localPoint, blastRadiusWorld, impactOptions) {
        // Deform indexed vertices and remove triangles where the crust breaks.
        const normal = localPoint.clone().normalize();
        const result = planetDamage.impact(localPoint, blastRadiusWorld, {
          planet, weapon: impactOptions.weapon, breach: impactOptions.breach
        });

        // 2. Convert 3D localPoint to Spherical UV to paint Scorched Crater & Glowing Magma
        const u = 0.5 + Math.atan2(normal.z, -normal.x) / (2 * Math.PI);
        const vCoord = 0.5 - Math.asin(Math.max(-1, Math.min(1, normal.y))) / Math.PI;

        const cx = u * TEX_W;
        const cy = vCoord * TEX_H;
        const rPx = Math.max(8, blastRadiusWorld / EARTH_RADIUS * TEX_W / (2 * Math.PI) * 1.10);

        // Equirectangular UVs repeat at the antimeridian; draw wrapped copies
        // so neither the scorch mark nor magma cracks are cut in half.
        const crackCount = 6 + Math.floor(Math.random() * 5);
        const cracks = Array.from({length: crackCount}, (_, i) => ({
          angle: (i / crackCount) * Math.PI * 2 + Math.random() * 0.5,
          length: rPx * (1.1 + Math.random() * 0.9)
        }));
        for (const dx of [-TEX_W, 0, TEX_W]) {
          const x = cx + dx;
          if (x + rPx * 2 < 0 || x - rPx * 2 > TEX_W) continue;
          const charGrad = surfaceCtx.createRadialGradient(
            x, cy, rPx * 0.1, x, cy, rPx * 1.6
          );
          charGrad.addColorStop(0, '#450a0a');
          charGrad.addColorStop(0.45, '#1c1917');
          charGrad.addColorStop(0.8, 'rgba(15, 23, 42, 0.75)');
          charGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
          surfaceCtx.fillStyle = charGrad;
          surfaceCtx.beginPath();
          surfaceCtx.arc(x, cy, rPx * 1.6, 0, Math.PI * 2);
          surfaceCtx.fill();

          const lavaGrad = emissiveCtx.createRadialGradient(
            x, cy, 1, x, cy, rPx * 1.25
          );
          lavaGrad.addColorStop(0, '#fef08a');
          lavaGrad.addColorStop(0.28, '#f97316');
          lavaGrad.addColorStop(0.65, '#dc2626');
          lavaGrad.addColorStop(1, 'rgba(185, 28, 28, 0)');
          emissiveCtx.fillStyle = lavaGrad;
          emissiveCtx.beginPath();
          emissiveCtx.arc(x, cy, rPx * 1.25, 0, Math.PI * 2);
          emissiveCtx.fill();

          emissiveCtx.strokeStyle = '#fb923c';
          emissiveCtx.lineWidth = 1.8 * (TEX_W / 1024);
          cracks.forEach(({angle, length}) => {
            emissiveCtx.beginPath();
            emissiveCtx.moveTo(x, cy);
            emissiveCtx.lineTo(
              x + Math.cos(angle + 0.15) * length * 0.5,
              cy + Math.sin(angle + 0.15) * length * 0.5
            );
            emissiveCtx.lineTo(
              x + Math.cos(angle) * length,
              cy + Math.sin(angle) * length
            );
            emissiveCtx.stroke();
          });
        }

        surfaceTexture.needsUpdate = true;
        emissiveTexture.needsUpdate = true;
        return result;
      }

      // ==========================================
      // 6. SINGLE WEAPON SYSTEM: ORBITAL THERMONUCLEAR MISSILE
      // ==========================================
      // Geometry and materials are allocated by the independent projectile visual factory.
      const projectileModels = window.GodSmashProjectiles;
      const projectileQuality = (Math.min(window.innerWidth, window.innerHeight) < 750 ||
        (navigator.connection && navigator.connection.saveData)) ? 'low' : 'high';
      const activeMissiles = [];
      const activeExplosions = [];
      const activeDebris = [];
      const smokeParticles = [];

      function createTargetReticle(localPos, localNormal) {
        const retGroup = new THREE.Group();
        const ringGeo = new THREE.RingGeometry(0.28, 0.38, 28);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xef4444,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.9
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        retGroup.add(ring);

        const innerGeo = new THREE.CircleGeometry(0.1, 16);
        const innerMat = new THREE.MeshBasicMaterial({
          color: 0xfbbf24,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        retGroup.add(new THREE.Mesh(innerGeo, innerMat));

        // Position slightly above surface in earthGroup's local space
        const offsetPos = localPos.clone().add(localNormal.clone().multiplyScalar(0.12));
        retGroup.position.copy(offsetPos);
        const lookTarget = offsetPos.clone().add(localNormal);
        retGroup.lookAt(lookTarget);

        earthGroup.add(retGroup);
        return retGroup;
      }

      function launchMissileAtWorldPoint(worldTargetPoint, delayMs = 0, selected = weapon) {
        if (state.shattered) return;

        const issued = generation;
        setTimeout(() => {
          if (state.shattered || issued !== generation) return;
          SoundEngine.playLaunch();

          // Convert world target point into Earth's local space so it tracks Earth's rotation!
          const localTarget = earthGroup.worldToLocal(worldTargetPoint.clone());
          const localNormal = localTarget.clone().normalize();
          localTarget.copy(localNormal).multiplyScalar(EARTH_RADIUS);

          const reticle = createTargetReticle(localTarget, localNormal);

          // Spawn missile from an orbital flank relative to camera
          const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
          const sideSign = Math.random() > 0.5 ? 1 : -1;

          // Starts inside the field of view for more legible close-up detail.
          const startPos = camera.position.clone().multiplyScalar(0.81)
            .add(camRight.multiplyScalar(sideSign * (4.0 + Math.random() * 1.4)))
            .add(camUp.multiplyScalar(1.3 + Math.random() * 0.9));

          // Control point for a high curved ballistic arc
          const currentWorldTarget = earthGroup.localToWorld(localTarget.clone());
          const midPoint = startPos.clone().lerp(currentWorldTarget, 0.5);
          const outwardDir = midPoint.clone().normalize();
          const controlPos = midPoint.add(outwardDir.multiplyScalar(7 + Math.random() * 3));

          const model = selected.kind === 'asteroid'
            ? projectileModels.createAsteroid(THREE, projectileQuality)
            : projectileModels.createMissile(THREE, selected.visualProfile || 'strategic', projectileQuality);
          const { group, plume } = model;
          group.position.copy(startPos);
          scene.add(group);

          activeMissiles.push({
            mesh: group,
            plume,
            dispose: model.dispose,
            trailClock: 0,
            weapon: selected,
            startPos,
            controlPos,
            localTarget,
            localNormal,
            reticle,
            progress: 0,
            speed: selected.speed * (0.92 + Math.random() * 0.15)
          });
        }, delayMs);
      }

      function spawnSmokeParticle(pos) {
        const geo = new THREE.SphereGeometry(0.11 + Math.random() * 0.08, 6, 6);
        const mat = new THREE.MeshBasicMaterial({
          color: Math.random() > 0.35 ? 0xf97316 : 0x94a3b8,
          transparent: true,
          opacity: 0.75
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        scene.add(mesh);
        smokeParticles.push({
          mesh,
          life: 1.0,
          decay: 1.6 + Math.random() * 0.6
        });
      }

      function triggerNuclearDetonation(localTarget, localNormal, selected = weapon) {
        SoundEngine.playExplosion(1.0);
        state.screenShake = Math.min(1.8, state.screenShake + selected.shake);

        // 1. Deform 3D Earth Geometry & Scorch Magma Texture
        const blastRadius = selected.blastRadius * (0.9 + Math.random() * 0.2);
        const projectedIntegrity = state.integrity - selected.damage / planet.resistance;
        const breach = selected.kind === 'asteroid' ||
          (projectedIntegrity < 67 && selected.kind !== 'beam') ||
          projectedIntegrity < 35;
        const damageResult = carveCraterOnEarth(localTarget, blastRadius, {
          weapon: selected, breach
        });

        // 2. Update Game Telemetry (Population & Core Integrity)
        state.impacts += 1;
        const dmg = (selected.damage + Math.random() * selected.damageVariance) / planet.resistance;
        state.integrity = Math.max(0, state.integrity - dmg);

        // Calculate casualties (higher near continental latitudes)
        const latFactor = 1.0 - Math.abs(localNormal.y) * 0.75;
        const casualties = Math.min(
          state.population,
          Math.floor((selected.casualties + Math.random() * selected.casualtiesVariance) * latFactor)
        );
        state.population = Math.max(0, state.population - casualties);

        const casMillions = Math.max(1, Math.round(casualties / 1000000));
        showImpactToast(damageResult.breached
          ? `${selected.nameFa}: بخشی از پوسته ${planet.nameFa} جدا شد!`
          : `${selected.nameFa}؛ تلفات: ${casMillions} میلیون نفر`);
        updateHUD();

        const blast = impactEffects.createEffect(THREE, selected, blastRadius, lowImpactQuality);
        blast.group.position.copy(localTarget);
        blast.group.lookAt(localTarget.clone().add(localNormal));
        earthGroup.add(blast.group);
        const maxEffects = lowImpactQuality ? 4 : 8;
        if (activeExplosions.length >= maxEffects) {
          const expired = activeExplosions.shift();
          earthGroup.remove(expired.group);
          expired.dispose();
        }
        activeExplosions.push({ ...blast, age: 0, maxAge: blast.duration });

        // 4. Eject Molten Rock Debris into Low Orbit
        const worldImpactPos = earthGroup.localToWorld(localTarget.clone());
        const worldNormal = localNormal.clone().applyQuaternion(earthGroup.quaternion).normalize();

        const debrisBudget = Math.max(0, 210 - activeDebris.length);
        const debrisCount = Math.min(debrisBudget,
          Math.ceil(selected.debrisCount * (lowImpactQuality ? 0.5 : 1.2)));
        for (let i = 0; i < debrisCount; i++) {
          const size = (0.09 + Math.random() * 0.22) * (damageResult.breached ? 1.65 : 1);
          const debGeo = new THREE.DodecahedronGeometry(size, 0);
          const debMat = new THREE.MeshBasicMaterial({
            color: i % 5 === 0 ? 0xffab57 : (planet.id === 'moon' ? 0x6b7280 : 0x63514a),
            transparent: true,
            opacity: 1.0
          });
          const debMesh = new THREE.Mesh(debGeo, debMat);
          debMesh.position.copy(worldImpactPos);

          const randVec = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
          ).normalize();
          const vel = worldNormal.clone().multiplyScalar(4.5 + Math.random() * 6.5)
            .add(randVec.multiplyScalar(3.5));

          scene.add(debMesh);
          activeDebris.push({
            mesh: debMesh,
            vel,
            life: 1.0,
            decay: (damageResult.breached ? 0.18 : 0.32) + Math.random() * 0.16
          });
        }

        // 5. Check for Planetary Core Rupture (0% Integrity)
        if (state.integrity <= 0 && !state.shattered) {
          triggerPlanetaryShatter();
        }
      }

      function triggerPlanetaryShatter() {
        state.shattered = true;
        state.population = 0;
        SoundEngine.playExplosion(1.6);
        state.screenShake = 1.8;
        updateHUD();
        showImpactToast('هسته ' + planet.nameFa + ' متلاشی شد!');

        // Hide intact Earth & clouds, spawn glowing asteroid fragments
        earthMesh.visible = false;
        cloudMesh.visible = false;
        atmosMesh.visible = false;
        planetDamage.setShattered(true);

        const shatterFragments = lowImpactQuality ? 42 : 95;
        for (let i = 0; i < shatterFragments; i++) {
          const size = 0.35 + Math.random() * 1.15;
          const fragGeo = new THREE.DodecahedronGeometry(size, 1);
          const isCore = Math.random() > 0.45;
          const fragMat = new THREE.MeshStandardMaterial({
            color: isCore ? 0xdc2626 : 0x334155,
            emissive: isCore ? 0xf97316 : 0x7c2d12,
            emissiveIntensity: isCore ? 1.2 : 0.35,
            roughness: 0.75
          });
          const frag = new THREE.Mesh(fragGeo, fragMat);
          const dir = new THREE.Vector3(
            Math.random() - 0.5,
            Math.random() - 0.5,
            Math.random() - 0.5
          ).normalize();
          frag.position.copy(dir.clone().multiplyScalar(Math.random() * EARTH_RADIUS * 0.7));
          const vel = dir.multiplyScalar(2.5 + Math.random() * 9.0);

          scene.add(frag);
          activeDebris.push({
            mesh: frag,
            vel,
            life: 1.0,
            decay: 0.08 // linger in space until reset
          });
        }
      }

      function resetEarth() {
        generation++;
        // Restore surface vertices, index topology and persistent scars.
        planetDamage.reset();

        // Restore pristine textures
        paintPlanet();
        surfaceTexture.needsUpdate = true;
        emissiveTexture.needsUpdate = true;

        // Clean up active missiles, explosions, debris
        while (activeMissiles.length > 0) {
          const m = activeMissiles.pop();
          scene.remove(m.mesh);
          earthGroup.remove(m.reticle);
          m.dispose();
          m.reticle.traverse(child => {
            if (child.geometry) child.geometry.dispose();
            if (child.material) child.material.dispose();
          });
        }
        while (activeExplosions.length > 0) {
          const e = activeExplosions.pop();
          earthGroup.remove(e.group);
          e.dispose();
        }
        while (smokeParticles.length > 0) {
          const particle = smokeParticles.pop();
          scene.remove(particle.mesh);
          particle.mesh.geometry.dispose();
          particle.mesh.material.dispose();
        }
        while (activeDebris.length > 0) {
          const d = activeDebris.pop();
          scene.remove(d.mesh);
          d.mesh.geometry.dispose();
          d.mesh.material.dispose();
        }

        earthMesh.visible = true;
        cloudMesh.visible = planet.cloudOpacity > 0;
        atmosMesh.visible = !!planet.atmosphereColor;

        state.population = planet.population;
        state.impacts = 0;
        state.integrity = 100;
        state.shattered = false;
        updateHUD();
        showImpactToast(planet.nameFa + ' بازسازی شد.');
      }

      const planetSelect = document.getElementById("planet-select");
      catalog.listPlanets().forEach(p => planetSelect.add(new Option(p.nameFa, p.id)));
      function selectWeapon(id) {
        const next = catalog.getWeapon(id);
        if (!next) return;
        weapon = next;
        document.getElementById("weapon-title").textContent = next.nameFa;
        document.getElementById("active-weapon-icon").textContent = next.icon || '●';
        document.getElementById("active-weapon-subtitle").textContent = next.subtitle || '';
        weaponDock.setSelected(next.id);
      }
      const weaponDock = window.GodSmashWeaponDock.mount({
        container: document.getElementById('weapon-dock-items'),
        weapons: catalog.listWeapons(),
        selectedId: weapon.id,
        onChange: selectWeapon
      });
      selectWeapon(weapon.id);

      // Prevent the dock from covering the fixed footer across viewport sizes.
      const footerControls = document.getElementById('game-controls');
      function positionWeaponDock() {
        const height = Math.ceil(footerControls.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--footer-clearance', (height + 24) + 'px');
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(positionWeaponDock).observe(footerControls);
      }
      window.addEventListener('resize', positionWeaponDock);
      positionWeaponDock();
      function selectPlanet(id) {
        const p = catalog.getPlanet(id);
        if (!p) return;
        planet = p;
        resetEarth();
        planetDamage.setPlanet(p);
        earthGroup.rotation.y = 0;
        cloudMesh.visible = p.cloudOpacity > 0;
        cloudMat.opacity = p.cloudOpacity;
        cloudMat.color.set(p.cloudTint || "#ffffff");
        window.GodSmashRealEarth.configure(
          THREE, earthMat, cloudMat, fallbackCloudTexture, p.id === "earth"
        );
        atmosMesh.visible = !!p.atmosphereColor;
        atmosMat.uniforms.rimColor.value.set(p.atmosphereColor || "#000000");
        document.getElementById("planet-name").textContent = "سیاره " + p.nameFa + " (" + p.nameEn + ")";
        document.querySelector("#btn-reset span:last-child").textContent = "بازسازی " + p.nameFa;
        planetSelect.value = p.id;
      }
      planetSelect.addEventListener("change", () => selectPlanet(planetSelect.value));

      function fireWeaponAtWorldPoint(point, delay = 0) {
        const selected = weapon;
        if (selected.kind !== "beam") return launchMissileAtWorldPoint(point, delay, selected);
        const issued = generation;
        setTimeout(() => {
          if (issued !== generation || state.shattered) return;
          const target = earthGroup.worldToLocal(point.clone()).normalize().multiplyScalar(EARTH_RADIUS);
          const normal = target.clone().normalize();
          const from = camera.position.clone().multiplyScalar(1.2);
          const to = earthGroup.localToWorld(target.clone());
          const delta = to.clone().sub(from);
          const beam = new THREE.Mesh(
            new THREE.CylinderGeometry(0.08, 0.12, delta.length(), 8),
            new THREE.MeshBasicMaterial({color: selected.plasmaColor, transparent: true, opacity: 0.8})
          );
          beam.position.copy(from).add(to).multiplyScalar(0.5);
          beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
          scene.add(beam);
          setTimeout(() => {scene.remove(beam); beam.geometry.dispose(); beam.material.dispose();}, 200);
          triggerNuclearDetonation(target, normal, selected);
        }, delay);
      }
      // ==========================================
      // 7. INPUT HANDLING: ORBIT CAMERA & CLICK-TO-FIRE
      // ==========================================
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();

      let isDragging = false;
      let downX = 0;
      let downY = 0;
      let prevX = 0;
      let prevY = 0;
      let downTime = 0;

      function fireMissileAtRay(clientX, clientY) {
        if (state.shattered) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointerNDC, camera);
        const hits = raycaster.intersectObject(earthMesh, false);

        if (hits.length > 0) {
          const hitPoint = hits[0].point;
          if (state.salvoMode) {
            // Fire 3 missiles of the exact same ICBM type in a tight cluster
            for (let s = 0; s < 3; s++) {
              const jitter = new THREE.Vector3(
                (Math.random() - 0.5) * 2.2,
                (Math.random() - 0.5) * 2.2,
                (Math.random() - 0.5) * 2.2
              );
              const targetPt = earthGroup.localToWorld(earthGroup.worldToLocal(hitPoint.clone()).add(jitter).normalize().multiplyScalar(EARTH_RADIUS));
              fireWeaponAtWorldPoint(targetPt, s * 130);
            }
          } else {
            fireWeaponAtWorldPoint(hitPoint, 0);
          }
        }
      }

      function fireAtScreenCenter() {
        const rect = renderer.domElement.getBoundingClientRect();
        fireMissileAtRay(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }

      renderer.domElement.addEventListener('pointerdown', (e) => {
        isDragging = true;
        downX = prevX = e.clientX;
        downY = prevY = e.clientY;
        downTime = performance.now();
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        prevX = e.clientX;
        prevY = e.clientY;

        state.cameraTheta -= dx * 0.0065;
        state.cameraPhi = Math.max(0.2, Math.min(Math.PI - 0.2, state.cameraPhi - dy * 0.0065));
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDragging) return;
        isDragging = false;
        const moveDist = Math.hypot(e.clientX - downX, e.clientY - downY);
        const elapsed = performance.now() - downTime;

        // If user clicked/tapped without dragging, fire missile at that point on Earth
        if (moveDist < 7 && elapsed < 450 && e.target === renderer.domElement) {
          fireMissileAtRay(e.clientX, e.clientY);
        }
      });

      renderer.domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        state.targetCameraDistance = Math.max(16, Math.min(52, state.targetCameraDistance + e.deltaY * 0.018));
      }, { passive: false });

      // UI Buttons & Keyboard Shortcuts
      btnAutoRotate.addEventListener('click', () => {
        state.autoRotate = !state.autoRotate;
        autoRotateLabel.textContent = state.autoRotate ? 'چرخش: روشن' : 'چرخش: خاموش';
      });

      btnAudio.addEventListener('click', () => {
        SoundEngine.muted = !SoundEngine.muted;
        audioIcon.textContent = SoundEngine.muted ? '🔇' : '🔊';
        audioLabel.textContent = SoundEngine.muted ? 'صدا: بی‌صدا' : 'صدا: فعال';
      });

      btnReset.addEventListener('click', () => {
        resetEarth();
      });

      btnModeToggle.addEventListener('click', () => {
        state.salvoMode = !state.salvoMode;
        modeLabel.textContent = state.salvoMode ? 'حالت: رگبار ۳تایی' : 'حالت: تک‌موشک';
      });

      btnFireCenter.addEventListener('click', () => {
        fireAtScreenCenter();
      });

      btnZoomIn.addEventListener('click', () => {
        state.targetCameraDistance = Math.max(16, state.targetCameraDistance - 3.5);
      });

      btnZoomOut.addEventListener('click', () => {
        state.targetCameraDistance = Math.min(52, state.targetCameraDistance + 3.5);
      });

      window.addEventListener('keydown', (e) => {
        if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        const digit = /^Digit([1-9])$/.exec(e.code);
        if (digit && weaponDock.selectAt(Number(digit[1]) - 1)) {
          e.preventDefault();
          return;
        }
        if (e.code === 'Space') {
          e.preventDefault();
          fireAtScreenCenter();
        } else if (e.code === 'KeyR') {
          resetEarth();
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // ==========================================
      // 8. MAIN ANIMATION & PHYSICS LOOP
      // ==========================================
      let lastTime = performance.now();

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        // 1. Rotate Earth & Clouds
        if (state.autoRotate && !state.shattered) {
          earthGroup.rotation.y += planet.rotationSpeed * dt;
        }
        cloudMesh.rotation.y += 0.05 * dt;

        // 2. Smooth Orbit Camera Position + Screen Shake
        state.cameraDistance += (state.targetCameraDistance - state.cameraDistance) * 0.12;
        const cx = state.cameraDistance * Math.sin(state.cameraPhi) * Math.sin(state.cameraTheta);
        const cy = state.cameraDistance * Math.cos(state.cameraPhi);
        const cz = state.cameraDistance * Math.sin(state.cameraPhi) * Math.cos(state.cameraTheta);

        camera.position.set(cx, cy, cz);
        if (state.screenShake > 0.005) {
          camera.position.x += (Math.random() - 0.5) * state.screenShake;
          camera.position.y += (Math.random() - 0.5) * state.screenShake;
          camera.position.z += (Math.random() - 0.5) * state.screenShake;
          state.screenShake *= Math.pow(0.04, dt);
        } else {
          state.screenShake = 0;
        }
        camera.lookAt(0, 0, 0);

        // 3. Update Active Ballistic Missiles
        for (let i = activeMissiles.length - 1; i >= 0; i--) {
          const m = activeMissiles[i];
          m.progress += m.speed * dt;

          // Pulse target reticle
          const s = 1.0 + 0.25 * Math.sin(now * 0.018);
          m.reticle.scale.set(s, s, s);

          // Quadratic Bézier interpolation toward moving point on rotating Earth
          const t = Math.min(1.0, m.progress);
          const worldTarget = earthGroup.localToWorld(m.localTarget.clone());

          const p0 = m.startPos;
          const p1 = m.controlPos;
          const p2 = worldTarget;

          const oneMinusT = 1 - t;
          const pos = new THREE.Vector3()
            .addScaledVector(p0, oneMinusT * oneMinusT)
            .addScaledVector(p1, 2 * oneMinusT * t)
            .addScaledVector(p2, t * t);

          // Tangent for missile orientation
          const nextT = Math.min(1.0, t + 0.02);
          const nextOneMinusT = 1 - nextT;
          const nextPos = new THREE.Vector3()
            .addScaledVector(p0, nextOneMinusT * nextOneMinusT)
            .addScaledVector(p1, 2 * nextOneMinusT * nextT)
            .addScaledVector(p2, nextT * nextT);

          m.mesh.position.copy(pos);
          m.mesh.lookAt(nextPos);
          if (m.plume) {
            m.plume.scale.setScalar(0.83 + Math.random() * 0.29);
            m.plume.children.forEach((flame, k) => {
              flame.material.opacity = (k === 0 ? 0.66 : 0.84) + Math.random() * 0.12;
            });
          }

          // Emission follows elapsed time rather than FPS; capped for mobile.
          m.trailClock += dt;
          const emissionInterval = projectileQuality === 'low' ? 0.09 : 0.05;
          if (m.weapon.kind === 'missile' && smokeParticles.length < 140 &&
              m.trailClock >= emissionInterval) {
            m.trailClock %= emissionInterval;
            const trailPos = m.mesh.localToWorld(new THREE.Vector3(
              0, 0, m.mesh.userData.trailOffsetZ
            ));
            spawnSmokeParticle(trailPos);
          }

          if (m.progress >= 1.0) {
            scene.remove(m.mesh);
            earthGroup.remove(m.reticle);
            m.dispose();
            m.reticle.traverse(child => {
              if (child.geometry) child.geometry.dispose();
              if (child.material) child.material.dispose();
            });
            activeMissiles.splice(i, 1);
            triggerNuclearDetonation(m.localTarget, m.localNormal, m.weapon);
          }
        }

        // 4. Update Smoke Trail Particles
        for (let i = smokeParticles.length - 1; i >= 0; i--) {
          const p = smokeParticles[i];
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            smokeParticles.splice(i, 1);
          } else {
            p.mesh.material.opacity = p.life * 0.65;
            p.mesh.scale.addScalar(dt * 1.4);
          }
        }

        // 5. Fireball, dust cloud and blast shockwave animation
        for (let i = activeExplosions.length - 1; i >= 0; i--) {
          const effect = activeExplosions[i];
          effect.age += dt;
          if (effect.age >= effect.maxAge) {
            earthGroup.remove(effect.group);
            effect.dispose();
            activeExplosions.splice(i, 1);
          } else {
            effect.update(effect.age / effect.maxAge);
          }
        }

        // 6. Update Orbital Debris
        for (let i = activeDebris.length - 1; i >= 0; i--) {
          const d = activeDebris[i];
          d.life -= d.decay * dt;
          if (d.life <= 0) {
            scene.remove(d.mesh);
            d.mesh.geometry.dispose();
            d.mesh.material.dispose();
            activeDebris.splice(i, 1);
          } else {
            d.mesh.position.addScaledVector(d.vel, dt);
            d.mesh.rotation.x += 2.5 * dt;
            d.mesh.rotation.y += 3.1 * dt;
            // Subtle gravitational pull toward origin if Earth is intact
            if (!state.shattered) {
              const pullDir = d.mesh.position.clone().normalize().multiplyScalar(-3.2 * dt);
              d.vel.add(pullDir);
            }
            if (d.mesh.material.transparent) {
              d.mesh.material.opacity = Math.min(1, d.life);
            }
          }
        }

        renderer.render(scene, camera);
      }

      window.onload = () => {
        // Start immediately with the procedural fallback, upgrade as assets arrive.
        selectPlanet("earth");
        updateHUD();
        requestAnimationFrame(animate);
        window.GodSmashRealEarth.preload().then(() => {
          if (planet.id !== "earth") return;
          window.GodSmashRealEarth.configure(
            THREE, earthMat, cloudMat, fallbackCloudTexture, true
          );
          // Never silently erase the player's craters during asynchronous loading.
          if (state.impacts === 0 && !state.shattered) {
            paintPlanet();
            surfaceTexture.needsUpdate = true;
            emissiveTexture.needsUpdate = true;
          }
        }).catch(error => {
          console.warn(error.message + '. Using generated Earth textures.');
        });
      };
    })();
  </script>
</body>
</html>
